<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f4f5f1">
  <title>FantaSquadra</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f1;
      color: #111;
    }

    body {
      padding: env(safe-area-inset-top)
               env(safe-area-inset-right)
               env(safe-area-inset-bottom)
               env(safe-area-inset-left);
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 12px 30px rgba(0,0,0,.08);
    }

    .badge {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: #173f2a;
      color: white;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 38px;
      line-height: 1.05;
    }

    .test {
      margin: 18px 0;
      font-size: 30px;
      font-weight: 800;
      color: #188244;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
      margin: 0 0 14px;
    }

    .status {
      margin-top: 22px;
      padding: 16px;
      border-radius: 16px;
      background: #eef7f1;
      font-weight: 700;
    }

    @media (max-width: 600px) {
      .wrap {
        padding: 20px 14px 32px;
      }

      .card {
        border-radius: 20px;
        padding: 22px;
      }

      h1 {
        font-size: 32px;
      }

      .test {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="card">
      <div class="badge">FantaSquadra · Test collegamento</div>

      <h1>Home</h1>

      <div class="test">prova github</div>

      <p>
        Questa pagina usa HTML normale, senza base64, gzip,
        DecompressionStream o altri meccanismi che possono creare
        problemi su Safari iPhone.
      </p>

      <div class="status">
        Se leggi questa scritta dal link Vercel, GitHub → Vercel funziona.
      </div>
    </section>
  </main>
</body>
</html>
