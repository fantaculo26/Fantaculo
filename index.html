<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f4f5f1">
<title>FantaSquadra</title>

<style>
:root{
  --bg:#f4f5f1;
  --card:#ffffff;
  --ink:#101512;
  --muted:#747c76;
  --line:#dfe4df;
  --green:#173f2a;
  --green2:#2f7d4d;
  --soft:#edf5ef;
  --red:#b42318;
  --gold:#a46d00;
  --shadow:0 10px 30px rgba(20,35,26,.07);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--ink);
}
body{
  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    calc(82px + env(safe-area-inset-bottom))
    env(safe-area-inset-left);
}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1280px;margin:auto;padding:18px}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}
.brand{font-size:27px;font-weight:900;letter-spacing:-.7px}
.subtitle{font-size:13px;color:var(--muted);margin-top:2px}

.card{
  background:var(--card);
  border:1px solid rgba(0,0,0,.05);
  border-radius:22px;
  padding:18px;
  box-shadow:var(--shadow);
}
h1,h2,h3,p{margin-top:0}
h1{font-size:30px;margin-bottom:7px}
h2{font-size:20px}
.muted{color:var(--muted)}

.btn{
  border:0;
  border-radius:13px;
  padding:11px 14px;
  font-weight:800;
}
.primary{background:var(--green);color:#fff}
.soft{background:var(--soft);color:var(--green)}
.danger{background:#fff0ef;color:var(--red)}
.full{width:100%}

.grid{display:grid;gap:14px}
.league-list{display:grid;gap:10px;margin-top:15px}
.league{
  border:1px solid var(--line);
  border-radius:17px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.league.active{border:2px solid var(--green)}
.league-name{font-weight:850}
.actions{display:flex;gap:7px;flex-wrap:wrap}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.stat{
  padding:14px;
  border-radius:17px;
  background:var(--soft);
}
.stat span{display:block;color:var(--muted);font-size:13px}
.stat b{display:block;font-size:25px;margin-top:3px}

.empty{
  padding:25px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:17px;
}

.auction-layout{display:grid;gap:14px}
.sticky{position:sticky;top:12px}

.chips{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}
.chip{
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:8px 14px;
  font-weight:850;
}
.chip.active{
  background:var(--green);
  border-color:var(--green);
  color:#fff;
}

.big{
  font-size:38px;
  font-weight:900;
  letter-spacing:-1px;
}
.role{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:29px;
  height:29px;
  padding:0 7px;
  background:var(--green);
  color:#fff;
  border-radius:999px;
  font-weight:900;
}

.search,
.field input,
.field select{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:13px;
  padding:12px 13px;
}
.field{margin-bottom:13px}
label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  margin-bottom:6px;
}
.two{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.player-list{
  display:grid;
  gap:8px;
  margin-top:10px;
  max-height:62vh;
  overflow:auto;
}
.player{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  border-radius:15px;
  padding:12px;
  text-align:left;
}
.player.selected-player{
  border:2px solid var(--green);
}
.player.sold{
  background:#e5e7eb;
  opacity:.72;
}
.player-name{font-weight:850;font-size:16px}
.meta{font-size:12px;color:var(--muted);margin-top:4px}

.ai-box{
  margin-top:13px;
  padding:14px;
  border-radius:16px;
  background:#f1f5f2;
  border:1px solid #dce8df;
}
.ai-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  font-weight:850;
  margin-bottom:7px;
}
.ai-status{
  font-size:12px;
  color:var(--muted);
}

table{width:100%;border-collapse:collapse}
th,td{
  padding:10px 8px;
  border-bottom:1px solid var(--line);
  text-align:left;
  font-size:14px;
}
th{font-size:12px;color:var(--muted)}

.team-grid{display:grid;gap:10px}
.team-card{
  border:1px solid var(--line);
  border-radius:17px;
  padding:14px;
}
.team-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:8px;
}

.bottomnav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:40;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}
.nav-inner{
  max-width:760px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(5,1fr);
}
.nav-btn{
  border:0;
  background:transparent;
  border-radius:12px;
  padding:10px 5px;
  font-size:12px;
  font-weight:850;
  color:var(--muted);
}
.nav-btn.active{background:var(--soft);color:var(--green)}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(0,0,0,.42);
  display:none;
  justify-content:center;
  align-items:flex-end;
  padding:16px;
}
.modal.open{display:flex}
.sheet{
  width:min(680px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:24px;
  padding:18px;
}
.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.close{
  width:36px;
  height:36px;
  border:0;
  border-radius:999px;
  font-size:20px;
}
.hidden{display:none!important}

@media(min-width:900px){
  .home-grid{grid-template-columns:1.15fr .85fr}
  .auction-layout{grid-template-columns:38% 62%}
  .stats{grid-template-columns:repeat(4,1fr)}
  .team-grid{grid-template-columns:repeat(2,1fr)}
  .app{padding:22px}
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">
  <div>
    <div class="brand">FantaSquadra</div>
    <div class="subtitle" id="subtitle">Nessuna lega selezionata</div>
  </div>
  <button class="btn primary" id="newLeagueTop">+ Lega</button>
</header>

<main>

<section id="view-home" class="view">

  <div class="grid home-grid">

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
        <div>
          <h1>Le mie rose</h1>
          <div class="muted">Gestisci le tue leghe.</div>
        </div>
        <button class="btn primary" id="newLeagueHome">Nuova lega</button>
      </div>

      <div id="leagueList" class="league-list"></div>
    </div>

    <div class="card">
      <h2>Strategia asta</h2>
      <div class="muted">
        Budget, slot e acquisti vengono ricalcolati durante l'asta.
      </div>

      <div id="homeStrategy" style="margin-top:15px"></div>
    </div>

  </div>

  <div id="dashboard" class="card" style="margin-top:14px"></div>

</section>


<section id="view-auction" class="view hidden">
  <div id="auctionHost"></div>
</section>


<section id="view-roster" class="view hidden">
  <div id="rosterHost"></div>
</section>


<section id="view-players" class="view hidden">

  <div class="card">

    <div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
      <div>
        <h1>Giocatori</h1>
        <div class="muted">Database utilizzato durante l'asta.</div>
      </div>

      <button class="btn soft" id="exportCsv">Esporta CSV</button>
    </div>

    <div class="two" style="margin-top:16px">

      <div class="field">
        <label>Importa database CSV</label>
        <input type="file" id="csvInput" accept=".csv,text/csv">
      </div>

      <div class="field">
        <label>Cerca</label>
        <input id="playerSearch" placeholder="Nome o squadra">
      </div>

    </div>

    <div id="playersTable"></div>

  </div>

</section>


<section id="view-more" class="view hidden">

  <div class="card">

    <h1>Altro</h1>

    <div class="field">
      <button class="btn soft" id="backupBtn">Scarica backup</button>
    </div>

    <div class="field">
      <label>Ripristina backup</label>
      <input type="file" id="restoreInput" accept=".json,application/json">
    </div>

    <div class="field">
      <button class="btn danger" id="resetBtn">
        Cancella dati locali
      </button>
    </div>

  </div>

</section>

</main>
</div>


<nav class="bottomnav">
<div class="nav-inner">

<button class="nav-btn active" data-view="home">Home</button>
<button class="nav-btn" data-view="auction">Asta</button>
<button class="nav-btn" data-view="roster">Rosa</button>
<button class="nav-btn" data-view="players">Giocatori</button>
<button class="nav-btn" data-view="more">Altro</button>

</div>
</nav>


<div class="modal" id="leagueModal">

<div class="sheet">

<div class="sheet-head">
<h2>Nuova lega</h2>
<button class="close" data-close="leagueModal">×</button>
</div>

<div class="field">
<label>Nome lega</label>
<input id="fLeague" placeholder="Lega Amici">
</div>

<div class="field">
<label>Nome tua squadra</label>
<input id="fTeam" placeholder="La mia squadra">
</div>

<div class="two">

<div class="field">
<label>Budget</label>
<input id="fBudget" type="number" value="500">
</div>

<div class="field">
<label>Numero squadre</label>
<input id="fTeams" type="number" value="10">
</div>

</div>

<div class="two">

<div class="field">
<label>Portieri</label>
<input id="fP" type="number" value="3">
</div>

<div class="field">
<label>Difensori</label>
<input id="fD" type="number" value="8">
</div>

</div>

<div class="two">

<div class="field">
<label>Centrocampisti</label>
<input id="fC" type="number" value="8">
</div>

<div class="field">

</div>

</div>

Salva lega
</button>

</div>


<div class="modal" id="buyModal">

<div class="sheet">

<div class="sheet-head">
<h2>Assegna giocatore</h2>
<button class="close" data-close="buyModal">×</button>
</div>

<div id="buyPlayerName"
style="font-size:22px;font-weight:900;margin-bottom:15px"></div>

<div class="two">

<div class="field">
<label>Prezzo finale</label>
<input id="buyPrice" type="number" min="1" value="1">
</div>

<div class="field">
<label>Squadra</label>
<select id="buyOwner"></select>
</div>

</div>

<button class="btn primary full" id="confirmBuy">
Conferma acquisto
</button>

</div>
</div>


<script>
(function(){

"use strict";

const STORAGE_KEY="fantasquadra_app_v10";

let state=loadState();

let activeRole="P";
let selectedPlayerId=null;


/* =========================
   ARCHIVIO
========================= */

function defaultState(){
  return{
    activeLeagueId:null,
    leagues:[],
    players:[]
  };
}

function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);

    if(raw){
      return JSON.parse(raw);
    }

    /*
      Recupero automatico dati della precedente v8.
      Evita di perdere la lega già creata.
    */

    const old=localStorage.getItem("fantasquadra_v8");

    if(old){
      const converted=JSON.parse(old);
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(converted)
      );
      return converted;
    }

  }catch(e){}

  return defaultState();
}

function saveState(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );
}


/* =========================
   UTILITÀ
========================= */

function uid(prefix){
  return prefix+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);
}

function league(){
  return state.leagues.find(
    x=>x.id===state.activeLeagueId
  )||null;
}

function escapeHtml(value){
  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function credits(v){
  return Number(v||0).toLocaleString("it-IT");
}

function roleLabel(r){
  return({
    P:"Portieri",
    D:"Difensori",
    C:"Centrocampisti",
    A:"Attaccanti"
  })[r]||r;
}

function tierLabel(t){
  return({
    top:"TOP",
    f1:"1ª FASCIA",
    f2:"2ª FASCIA",
    value:"VALUE",
    bet:"SCOMMESSA"
  })[t]||"—";
}

function openModal(id){
  document.getElementById(id).classList.add("open");
}

function closeModal(id){
  document.getElementById(id).classList.remove("open");
}


/* =========================
   LEGHE
========================= */

function createLeague(){

  document.getElementById("fLeague").value="";
  document.getElementById("fTeam").value="";

  openModal("leagueModal");
}

function saveLeague(){

  const leagueName=
    document.getElementById("fLeague").value.trim()
    ||"Nuova Lega";

  const teamName=
    document.getElementById("fTeam").value.trim()
    ||"La mia squadra";

  const budget=Math.max(
    1,
    Number(document.getElementById("fBudget").value)||500
  );

  const totalTeams=Math.max(
    2,
    Number(document.getElementById("fTeams").value)||10
  );

  const slots={
    P:Number(document.getElementById("fP").value)||3,
    D:Number(document.getElementById("fD").value)||8,
    C:Number(document.getElementById("fC").value)||8,
    A:Number(document.getElementById("fA").value)||6
  };

  const teams=[{
    id:uid("team"),
    name:teamName,
    isMine:true,
    budgetStart:budget,
    budgetLeft:budget,
    roster:[]
  }];

  for(let i=2;i<=totalTeams;i++){

    teams.push({
      id:uid("team"),
      name:"Avversario "+i,
      isMine:false,
      budgetStart:budget,
      budgetLeft:budget,
      roster:[]
    });

  }

  const newLeague={
    id:uid("league"),
    name:leagueName,
    budgetStart:budget,
    slots,
    teams,
    createdAt:Date.now()
  };

  state.leagues.push(newLeague);
  state.activeLeagueId=newLeague.id;

  saveState();
  closeModal("leagueModal");

  renderAll();
}

function deleteLeague(id){

  if(!confirm("Eliminare questa lega?")){
    return;
  }

  state.leagues=
    state.leagues.filter(x=>x.id!==id);

  if(state.activeLeagueId===id){
    state.activeLeagueId=
      state.leagues[0]?.id||null;
  }

  saveState();
  renderAll();
}


/* =========================
   ROSA / ACQUISTI
========================= */

function roleCount(team,role){

  const ids=team.roster.map(x=>x.playerId);

  return state.players.filter(
    p=>ids.includes(p.id)&&p.role===role
  ).length;
}

function playerOwner(playerId,l){

  for(const team of l.teams){

    const rec=team.roster.find(
      x=>x.playerId===playerId
    );

    if(rec){
      return{
        team,
        record:rec
      };
    }

  }

  return null;
}


/* =========================
   STRATEGIA LOCALE
========================= */

function remainingSlots(l,team){

  return Object.entries(l.slots)
    .reduce(
      (sum,[role,total])=>
        sum+Math.max(
          0,
          total-roleCount(team,role)
        ),
      0
    );
}

function maxBid(player,l,me){

  const roleRemaining=
    Math.max(
      0,
      l.slots[player.role]-
      roleCount(me,player.role)
    );

  if(roleRemaining===0){
    return 0;
  }

  const remaining=
    remainingSlots(l,me);

  const mandatoryReserve=
    Math.max(0,remaining-1);

  const hardLimit=
    Math.max(
      1,
      me.budgetLeft-mandatoryReserve
    );

  const weights={
    top:.45,
    f1:.27,
    f2:.17,
    value:.10,
    bet:.06
  };

  const weight=
    weights[player.tier]||.08;

  const strategicLimit=
    Math.max(
      1,
      Math.floor(me.budgetLeft*weight)
    );

  return Math.min(
    hardLimit,
    strategicLimit
  );
}

function localStrategySummary(l,me){

  const remain=remainingSlots(l,me);

  if(remain===0){
    return "Rosa completa.";
  }

  const avg=
    Math.floor(
      me.budgetLeft/remain
    );

  let message=
    "Hai "+credits(me.budgetLeft)+
    " crediti per "+remain+
    " slot. Media disponibile: "+
    avg+" crediti per acquisto.";

  if(me.budgetLeft/me.budgetStart>.70){
    message+=" Hai ancora ampia capacità di spesa.";
  }

  if(me.budgetLeft/me.budgetStart<.40){
    message+=" Budget contratto: aumenta la selettività sui rilanci.";
  }

  return message;
}


/* =========================
   FUTURA STRATEGIA AI
========================= */

async function requestAIStrategy(){

  const l=league();

  if(!l){
    return;
  }

  const box=document.getElementById("aiText");

  if(!box){
    return;
  }

  box.textContent="Analisi in corso…";

  const me=l.teams.find(t=>t.isMine);

  const player=
    state.players.find(
      p=>p.id===selectedPlayerId
    )||null;

  const payload={
    league:l,
    myTeam:me,
    selectedPlayer:player,
    activeRole,
    timestamp:Date.now()
  };

  try{

    const response=await fetch(
      "/api/strategy",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(payload)
      }
    );

    if(!response.ok){
      throw new Error();
    }

    const data=await response.json();

    box.textContent=
      data.analysis||
      data.message||
      "Analisi completata.";

  }catch(e){

    box.textContent=
      "Assistente AI non ancora collegato. "+
      "La strategia locale continua a funzionare.";

  }
}


/* =========================
   HOME
========================= */

function renderHome(){

  const list=
    document.getElementById("leagueList");

  const l=league();

  document.getElementById("subtitle").textContent=
    l
    ? l.name+" · "+l.teams.find(t=>t.isMine).name
    : "Nessuna lega selezionata";

  if(!state.leagues.length){

    list.innerHTML=
      '<div class="empty">'+
      'Nessuna lega presente.'+
      '</div>';

  }else{

    list.innerHTML=
      state.leagues.map(item=>{

        const me=
          item.teams.find(t=>t.isMine);

        return `
        <div class="league ${item.id===state.activeLeagueId?"active":""}">

          <div>
            <div class="league-name">
              ${escapeHtml(item.name)}
            </div>

            <div class="meta">
              ${escapeHtml(me.name)}
              · ${credits(me.budgetLeft)} crediti
            </div>
          </div>

          <div class="actions">

            <button
              class="btn soft"
              data-open-league="${item.id}">
              Apri
            </button>

            <button
              class="btn danger"
              data-delete-league="${item.id}">
              Elimina
            </button>

          </div>

        </div>
        `;

      }).join("");

  }

  const dash=
    document.getElementById("dashboard");

  const strategy=
    document.getElementById("homeStrategy");

  if(!l){

    dash.innerHTML=
      '<div class="empty">'+
      'Crea o seleziona una lega.'+
      '</div>';

    strategy.innerHTML=
      '<div class="empty">'+
      'La strategia apparirà qui.'+
      '</div>';

    return;
  }

  const me=
    l.teams.find(t=>t.isMine);

  const totalSlots=
    Object.values(l.slots)
    .reduce((a,b)=>a+b,0);

  dash.innerHTML=`

    <h2>${escapeHtml(l.name)}</h2>

    <div class="stats">

      <div class="stat">
        <span>Budget</span>
        <b>${credits(me.budgetLeft)}</b>
      </div>

      <div class="stat">
        <span>Speso</span>
        <b>${credits(me.budgetStart-me.budgetLeft)}</b>
      </div>

      <div class="stat">
        <span>Giocatori</span>
        <b>${me.roster.length}</b>
      </div>

      <div class="stat">
        <span>Mancano</span>
        <b>${Math.max(0,totalSlots-me.roster.length)}</b>
      </div>

    </div>
  `;

  strategy.innerHTML=`
    <div class="ai-box">
      ${escapeHtml(localStrategySummary(l,me))}
    </div>
  `;
}


/* =========================
   ASTA
========================= */

function renderAuction(){

  const host=
    document.getElementById("auctionHost");

  const l=league();

  if(!l){

    host.innerHTML=
      '<div class="card empty">'+
      'Seleziona una lega prima di iniziare l’asta.'+
      '</div>';

    return;
  }

  const me=
    l.teams.find(t=>t.isMine);

  const search=
    (
      document.getElementById("auctionSearch")
      ?.value||""
    ).toLowerCase();

  const players=
    state.players.filter(p=>
      p.role===activeRole &&
      (
        !search ||
        p.name.toLowerCase().includes(search) ||
        p.team.toLowerCase().includes(search)
      )
    );

  let selected=
    state.players.find(
      p=>p.id===selectedPlayerId
    );

  if(!selected || selected.role!==activeRole){
    selected=players[0]||null;
  }

  if(selected){
    selectedPlayerId=selected.id;
  }

  const max=
    selected
    ? maxBid(selected,l,me)
    : 0;

  const target=
    selected
    ? Math.max(1,Math.floor(max*.72))
    : 0;

  host.innerHTML=`

  <div class="auction-layout">

    <div class="card sticky">

      <h2>Asta Live</h2>

      <div class="chips">

        ${["P","D","C","A"].map(r=>`
          <button
            class="chip ${r===activeRole?"active":""}"
            data-role="${r}">
            ${r}
          </button>
        `).join("")}

      </div>

      <div style="height:15px"></div>

      <div class="muted">Budget residuo</div>
      <div class="big">${credits(me.budgetLeft)}</div>

      <div class="meta">
        ${roleLabel(activeRole)} mancanti:
        <b>
          ${Math.max(
            0,
            l.slots[activeRole]-
            roleCount(me,activeRole)
          )}
        </b>
      </div>

      <hr style="border:0;border-top:1px solid var(--line);margin:17px 0">

      ${
        selected
        ?`

        <div class="meta">
          ${escapeHtml(selected.team)}
          · ${tierLabel(selected.tier)}
        </div>

        <h1>${escapeHtml(selected.name)}</h1>

        <div class="stats">

          <div class="stat">
            <span>Target</span>
            <b>${target}</b>
          </div>

          <div class="stat">
            <span>MAX</span>
            <b>${max}</b>
          </div>

        </div>

        <div class="ai-box">

          <div class="ai-title">
            <span>Strategia</span>
            <span class="ai-status">AI pronta</span>
          </div>

          <div id="aiText">
            ${escapeHtml(localStrategySummary(l,me))}
          </div>

          <div style="height:10px"></div>

          <button
            class="btn soft full"
            id="askAI">
            Analizza strategia
          </button>

        </div>

        <div style="height:12px"></div>

        <button
          class="btn primary full"
          id="buyButton">
          Assegna / compra
        </button>

        `
        :`
        <div class="empty">
          Nessun giocatore disponibile.
        </div>
        `
      }

    </div>


    <div class="card">

      <h2>
        ${roleLabel(activeRole)}
      </h2>

      <input
        id="auctionSearch"
        class="search"
        value="${escapeHtml(search)}"
        placeholder="Cerca giocatore o squadra">

      <div class="player-list">

      ${
        players.length
        ?players.map(p=>{

          const owner=
            playerOwner(p.id,l);

          return`

          <button
            class="player
            ${owner?"sold":""}
            ${p.id===selectedPlayerId?"selected-player":""}"
            data-player="${p.id}">

            <div class="player-name">
              ${escapeHtml(p.name)}
            </div>

            <div class="meta">
              ${escapeHtml(p.team)}
              · ${tierLabel(p.tier)}
              ${p.tactical?" · "+escapeHtml(p.tactical):""}
            </div>

            ${
              owner
              ?`
              <div class="meta">
                ✓ VENDUTO a
                ${escapeHtml(owner.team.name)}
                · ${credits(owner.record.price)}
              </div>
              `
              :""
            }

          </button>
          `;

        }).join("")
        :`
        <div class="empty">
          Nessun giocatore nel database per questo ruolo.
        </div>
        `
      }

      </div>

    </div>

  </div>
  `;

  const s=
    document.getElementById("auctionSearch");

  if(s){
    s.oninput=renderAuction;
  }

}


/* =========================
   ASSEGNAZIONE
========================= */

function openBuy(){

  const l=league();

  const player=
    state.players.find(
      p=>p.id===selectedPlayerId
    );

  if(!l||!player){
    return;
  }

  if(playerOwner(player.id,l)){
    alert("Giocatore già assegnato.");
    return;
  }

  document.getElementById(
    "buyPlayerName"
  ).textContent=
    player.name+" · "+player.team;

  document.getElementById(
    "buyPrice"
  ).value=1;

  document.getElementById(
    "buyOwner"
  ).innerHTML=
    l.teams.map(team=>`
      <option value="${team.id}">
        ${escapeHtml(team.name)}
        · ${credits(team.budgetLeft)}
      </option>
    `).join("");

  openModal("buyModal");
}

function confirmBuy(){

  const l=league();

  const player=
    state.players.find(
      p=>p.id===selectedPlayerId
    );

  if(!l||!player){
    return;
  }

  const team=
    l.teams.find(
      t=>t.id===
      document.getElementById("buyOwner").value
    );

  const price=
    Math.max(
      1,
      Number(
        document.getElementById("buyPrice").value
      )||1
    );

  if(price>team.budgetLeft){

    alert("Budget insufficiente.");
    return;
  }

  if(
    team.isMine &&
    roleCount(team,player.role)>=l.slots[player.role]
  ){

    alert(
      "Hai già completato gli slot di questo ruolo."
    );

    return;
  }

  team.budgetLeft-=price;

  team.roster.push({
    playerId:player.id,
    price,
    timestamp:Date.now()
  });

  saveState();

  closeModal("buyModal");

  renderAll();
}

/* =========================
   CSV
========================= */

function parseCSV(text){

  const lines=
    text
    .replace(/\r/g,"")
    .split("\n")
    .filter(Boolean);

  if(lines.length<2){
    return[];
  }

  function split(line){

    const out=[];

    let current="";
    let quoted=false;

    for(let i=0;i<line.length;i++){

      const char=line[i];

      if(char==='"'){

        if(
          quoted &&
          line[i+1]==='"'
        ){
          current+='"';
          i++;
        }else{
          quoted=!quoted;
        }

      }else if(
        (char===","||char===";") &&
        !quoted
      ){

        out.push(current.trim());
        current="";

      }else{

        current+=char;

      }
    }

    out.push(current.trim());

    return out;
  }

  const headers=
    split(lines[0])
    .map(x=>x.toLowerCase());

  return lines.slice(1)
  .map(row=>{

    const values=split(row);

    const obj={};

    headers.forEach(
      (header,i)=>{
        obj[header]=values[i]||"";
      }
    );

    const role=
      (
        obj.role||
        obj.ruolo||
        ""
      ).toUpperCase();

    const name=
      obj.name||
      obj.nome||
      "";

    if(
      !name ||
      !["P","D","C","A"].includes(role)
    ){
      return null;
    }

    return{
      id:uid("player"),
      name,
      team:
        obj.team||
        obj.squadra||
        "",
      role,
      tier:
        (
          obj.tier||
          obj.fascia||
          "value"
        ).toLowerCase(),
      starter:
        obj.starter||
        obj.titolarita||
        "",
      tactical:
        obj.tactical||
        obj.ruoloreale||
        obj.ruolo_reale||
        "",
      quote:
        Number(
          obj.quote||
          obj.quotazione||
          0
        )||0
    };

  })
  .filter(Boolean);
}

function importCSV(file){

  const reader=new FileReader();

  reader.onload=()=>{

    const imported=
      parseCSV(reader.result);

    if(!imported.length){

      alert("CSV non riconosciuto.");
      return;
    }

    state.players=imported;

    saveState();

    renderAll();

    alert(
      "Importati "+
      imported.length+
      " giocatori."
    );
  };

  reader.readAsText(file);
}


/* =========================
   DOWNLOAD / BACKUP
========================= */

function download(name,text,type){

  const blob=
    new Blob(
      [text],
      {type}
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement("a");

  a.href=url;
  a.download=name;

  a.click();

  setTimeout(
    ()=>URL.revokeObjectURL(url),
    1000
  );
}

function exportCSV(){

  const rows=[

    [
      "name",
      "team",
      "role",
      "tier",
      "starter",
      "tactical",
      "quote"
    ],

    ...state.players.map(p=>[
      p.name,
      p.team,
      p.role,
      p.tier,
      p.starter,
      p.tactical,
      p.quote
    ])

  ];

  const csv=
    rows.map(row=>
      row.map(value=>
        `"${String(value??"")
        .replace(/"/g,'""')}"`
      ).join(",")
    ).join("\n");

  download(
    "fantasquadra-giocatori.csv",
    csv,
    "text/csv;charset=utf-8"
  );
}

function backup(){

  download(
    "fantasquadra-backup.json",
    JSON.stringify(state,null,2),
    "application/json"
  );
}

function restore(file){

  const reader=
    new FileReader();

  reader.onload=()=>{

    try{

      const data=
        JSON.parse(reader.result);

      if(
        !Array.isArray(data.leagues) ||
        !Array.isArray(data.players)
      ){
        throw new Error();
      }

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
      );

      location.reload();

    }catch(e){

      alert("Backup non valido.");

    }

  };

  reader.readAsText(file);
}


/* =========================
   NAVIGAZIONE
========================= */

function switchView(name){

  document.querySelectorAll(
    ".view"
  ).forEach(
    v=>v.classList.add("hidden")
  );

  document.getElementById(
    "view-"+name
  ).classList.remove("hidden");

  document.querySelectorAll(
    ".nav-btn"
  ).forEach(
    btn=>
      btn.classList.toggle(
        "active",
        btn.dataset.view===name
      )
  );

  if(name==="auction"){
    renderAuction();
  }

  if(name==="roster"){
    renderRoster();
  }

  if(name==="players"){
    renderPlayers();
  }
}


/* =========================
   EVENTI
========================= */

document.addEventListener(
  "click",
  event=>{

    const button=
      event.target.closest("button");

    if(!button){
      return;
    }

    if(button.dataset.view){
      switchView(button.dataset.view);
    }

    if(button.dataset.close){
      closeModal(button.dataset.close);
    }

    if(button.dataset.openLeague){

      state.activeLeagueId=
        button.dataset.openLeague;

      saveState();
      renderAll();
    }

    if(button.dataset.deleteLeague){
      deleteLeague(
        button.dataset.deleteLeague
      );
    }

    if(button.dataset.role){

      activeRole=
        button.dataset.role;

      selectedPlayerId=null;

      renderAuction();
    }

    if(button.dataset.player){

      selectedPlayerId=
        button.dataset.player;

      renderAuction();
    }

    if(button.id==="buyButton"){
      openBuy();
    }

    if(button.id==="askAI"){
      requestAIStrategy();
    }

  }
);

  "newLeagueTop"
).onclick=createLeague;

document.getElementById(
  "newLeagueHome"
).onclick=createLeague;

document.getElementById(
  "saveLeague"
).onclick=saveLeague;

document.getElementById(
  "confirmBuy"
).onclick=confirmBuy;

document.getElementById(
  "csvInput"
).onchange=e=>{

  if(e.target.files[0]){
    importCSV(e.target.files[0]);
  }

};

document.getElementById(
  "exportCsv"
).onclick=exportCSV;

document.getElementById(
  "backupBtn"
).onclick=backup;

document.getElementById(
  "restoreInput"
).onchange=e=>{

  if(e.target.files[0]){
    restore(e.target.files[0]);
  }

};

document.getElementById(
  "resetBtn"
).onclick=()=>{

  if(
    confirm(
      "Cancellare tutti i dati locali di FantaSquadra?"
    )
  ){

    localStorage.removeItem(
      STORAGE_KEY
    );

    location.reload();
  }

};


/* =========================
   AVVIO
========================= */

function renderAll(){
  renderHome();
  renderAuction();
  renderRoster();
  renderPlayers();
}

renderAll();

})();
