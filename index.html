*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(82px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1280px;margin:auto;padding:18px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{font-size:27px;font-weight:900}.subtitle,.muted,.meta{color:var(--muted)}.subtitle,.meta{font-size:12px}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.05)}h1,h2{margin-top:0}h1{font-size:30px;margin-bottom:7px}h2{font-size:20px}.btn{border:0;border-radius:13px;padding:11px 14px;font-weight:800}.primary{background:var(--green);color:#fff}.soft{background:var(--soft);color:var(--green)}.danger{background:#fff0ef;color:var(--red)}.full{width:100%}.homegrid,.auction-layout,.team-grid,.call-list,.league-list,.player-list{display:grid;gap:10px}.league{border:1px solid var(--line);border-radius:17px;padding:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.league.active{border:2px solid var(--green)}.actions{display:flex;gap:7px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--soft);border-radius:17px;padding:14px}.stat span{display:block;font-size:12px;color:var(--muted)}.stat b{display:block;font-size:24px}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:17px}.notice{padding:13px;border-radius:15px;background:#fff8dc;border:1px solid #eadc98;font-size:13px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-weight:850}.chip.active{background:var(--green);color:#fff}.big{font-size:38px;font-weight:900}.search,.field input,.field select{width:100%;border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 13px}.field{margin-bottom:12px}label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.role{display:inline-flex;align-items:center;justify-content:center;min-width:29px;height:29px;padding:0 7px;background:var(--green);color:#fff;border-radius:999px;font-weight:900}.band{font-size:11px;font-weight:900;border-radius:999px;padding:5px 8px;display:inline-block}.band-high{background:#e7f4ea;color:#1b6335}.band-mid{background:var(--amberbg);color:var(--amber)}.band-low{background:var(--bluebg);color:var(--blue)}.call-card{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.call-card.high{border-left:7px solid #2f7d4d}.call-card.mid{border-left:7px solid #d29328}.call-card.low{border-left:7px solid #6597c7}.call-card.lost{opacity:.45}.call-card.taken{background:#eef7f0}.call-name,.player-name{font-weight:900}.quick-actions{display:flex;gap:7px}.thumb{width:44px;height:44px;border:0;border-radius:13px;font-size:21px}.thumb.up{background:#e7f4ea}.thumb.down{background:#fff0ef}.player-list{max-height:62vh;overflow:auto;margin-top:10px}.player{width:100%;text-align:left;border:1px solid var(--line);border-radius:15px;padding:12px;background:#fff}.player.sold{background:#e5e7eb;opacity:.7}.player.selected{border:2px solid var(--green)}.ai-box{margin-top:13px;padding:14px;border-radius:16px;background:#f1f5f2;border:1px solid #dce8df}.ai-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px}.reserve-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.reserve{border:1px solid var(--line);border-radius:14px;padding:10px}.reserve small{display:block;color:var(--muted)}.reserve b{font-size:19px}table{width:100%;border-collapse:collapse}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}th{font-size:12px;color:var(--muted)}.team-card{border:1px solid var(--line);border-radius:17px;padding:14px}.team-head{display:flex;justify-content:space-between;gap:10px}.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.navinner{display:grid;grid-template-columns:repeat(5,1fr);max-width:760px;margin:auto}.navbtn{border:0;background:transparent;border-radius:12px;padding:10px 4px;font-size:12px;font-weight:850;color:var(--muted)}.navbtn.active{background:var(--soft);color:var(--green)}.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;padding:16px}.modal.open{display:flex}.sheet{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;padding:18px}.sheethead{display:flex;justify-content:space-between;align-items:center}.close{border:0;border-radius:999px;width:36px;height:36px}.hidden{display:none!important}@media(min-width:900px){.homegrid{grid-template-columns:1.05fr .95fr}.auction-layout{grid-template-columns:38% 62%}.stats{grid-template-columns:repeat(4,1fr)}.team-grid,.call-list{grid-template-columns:repeat(2,1fr)}.app{padding:22px}}

<div class="app"><header class="topbar"><div><div class="brand">FantaSquadra</div><div class="subtitle" id="subtitle">Nessuna lega selezionata</div></div><button class="btn primary" id="newLeagueTop">+ Lega</button></header><main>
<section id="view-home" class="view"><div class="homegrid"><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><h1>Le mie rose</h1><div class="muted">Gestisci leghe e budget.</div></div><button class="btn primary" id="newLeagueHome">Nuova lega</button></div><div id="leagueList" class="league-list" style="margin-top:14px"></div></div><div class="card"><h2>Fantagettoni & riserve</h2><div id="budgetPanel"></div></div></div><div id="dashboard" class="card" style="margin-top:14px"></div></section>

</main></div>

<div class="modal" id="leagueModal"><div class="sheet"><div class="sheethead"><h2>Nuova lega</h2><button class="close" data-close="leagueModal">×</button></div><div class="field"><label>Nome lega</label><input id="fLeague"></div><div class="field"><label>Nome tua squadra</label><input id="fTeam"></div><div class="two"><div class="field"><label>Budget</label><input id="fBudget" type="number" value="500"></div><div class="field"><label>Squadre</label><input id="fTeams" type="number" value="10"></div></div><div class="two"><div class="field"><label>P</label><input id="fP" type="number" value="3"></div><div class="field"><label>D</label><input id="fD" type="number" value="8"></div></div><div class="two"><div class="field"><label>C</label><input id="fC" type="number" value="8"></div><div class="field"><label>A</label><input id="fA" type="number" value="6"></div></div><div class="two"><div class="field"><label>Riserva top attacco</label><input id="fAttackReserve" type="number" value="220"></div><div class="field"><label>Riserva C offensivi</label><input id="fMidReserve" type="number" value="55"></div></div><button class="btn primary full" id="saveLeague">Salva lega</button></div></div>
<div class="modal" id="buyModal"><div class="sheet"><div class="sheethead"><h2>Acquisto</h2><button class="close" data-close="buyModal">×</button></div><div id="buyPlayerName" style="font-size:22px;font-weight:900;margin-bottom:14px"></div><div class="two"><div class="field"><label>Prezzo</label><input id="buyPrice" type="number" value="1"></div><div class="field"><label>Squadra</label><select id="buyOwner"></select></div></div><button class="btn primary full" id="confirmBuy">Conferma</button></div></div>
<script>
(function(){"use strict";const KEY="fantasquadra_app_v11";let activeRole="P",callRole="P",selectedPlayerId=null;let state=load();
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);for(const k of ["fantasquadra_app_v10","fantasquadra_v8"]){const o=localStorage.getItem(k);if(o){const x=JSON.parse(o);x.callStatus=x.callStatus||{};localStorage.setItem(KEY,JSON.stringify(x));return x}}}catch(e){}return{activeLeagueId:null,leagues:[],players:[],callStatus:{}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function uid(p){return p+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,7)}function L(){return state.leagues.find(x=>x.id===state.activeLeagueId)||null}function esc(x){return String(x??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;")}function money(x){return Number(x||0).toLocaleString("it-IT")}function tierLabel(t){return({top:"TOP",f1:"1ª FASCIA",f2:"2ª FASCIA",value:"VALUE",bet:"SCOMMESSA"}[t]||"—")}function bandOf(p){return ["top","f1"].includes(p.tier)?"high":["f2","value"].includes(p.tier)?"mid":"low"}function openM(x){document.getElementById(x).classList.add("open")}function closeM(x){document.getElementById(x).classList.remove("open")}
function roleCount(t,r){const ids=t.roster.map(x=>x.playerId);return state.players.filter(p=>ids.includes(p.id)&&p.role===r).length}function owner(pid,l){for(const t of l.teams){const rec=t.roster.find(x=>x.playerId===pid);if(rec)return{team:t,record:rec}}return null}function remainingSlots(l,t){return Object.entries(l.slots).reduce((s,[r,n])=>s+Math.max(0,n-roleCount(t,r)),0)}function minCompletion(l,t){return Math.max(0,remainingSlots(l,t)-1)}function reserves(l,me){const ar=roleCount(me,"A")<l.slots.A?Math.min(me.budgetLeft,l.attackReserve??Math.round(l.budgetStart*.44)):0;const mr=roleCount(me,"C")<l.slots.C?Math.min(Math.max(0,me.budgetLeft-ar),l.midReserve??Math.round(l.budgetStart*.11)):0;const c=minCompletion(l,me);return{attackReserve:ar,midReserve:mr,completion:c,free:Math.max(0,me.budgetLeft-ar-mr-c)}}function maxBid(p,l,me){if(l.slots[p.role]-roleCount(me,p.role)<=0)return 0;const r=reserves(l,me),w={top:.75,f1:.52,f2:.34,value:.22,bet:.12}[p.tier]||.18;let s=Math.max(1,Math.floor((r.free||me.budgetLeft)*w));if(p.role==="A")s=Math.max(s,Math.floor(me.budgetLeft*.38));if(p.role==="C"&&+p.bonus>=7)s=Math.max(s,Math.floor(me.budgetLeft*.16));return Math.min(Math.max(1,me.budgetLeft-minCompletion(l,me)),s)}function score(p){return({top:100,f1:80,f2:60,value:45,bet:30}[p.tier]||35)+(+p.bonus||0)*4+(+p.modifier||0)*2+(+p.priority||0)*5+(String(p.starter||"").toLowerCase().includes("titol")?10:0)}
function shortlist(r){const l=L(),pool=state.players.filter(p=>p.role===r&&(!l||!owner(p.id,l))),marked=pool.filter(p=>["1","true"].includes(String(p.call||"").toLowerCase())||+p.priority>0),src=marked.length>=10?marked:pool;return src.sort((a,b)=>score(b)-score(a)).slice(0,Math.min(14,src.length))}function sk(pid){return(L()?.id||"none")+":"+pid}function status(pid){return state.callStatus?.[sk(pid)]||"pending"}function setStatus(pid,s){state.callStatus=state.callStatus||{};state.callStatus[sk(pid)]=s;save()}
function newLeague(){openM("leagueModal")}function saveLeague(){const budget=Math.max(1,+fBudget.value||500),teams=[{id:uid("t"),name:fTeam.value.trim()||"La mia squadra",isMine:true,budgetStart:budget,budgetLeft:budget,roster:[]}],n=Math.max(2,+fTeams.value||10);for(let i=2;i<=n;i++)teams.push({id:uid("t"),name:"Avversario "+i,isMine:false,budgetStart:budget,budgetLeft:budget,roster:[]});const l={id:uid("l"),name:fLeague.value.trim()||"Nuova Lega",budgetStart:budget,slots:{P:+fP.value||3,D:+fD.value||8,C:+fC.value||8,A:+fA.value||6},teams,attackReserve:+fAttackReserve.value||220,midReserve:+fMidReserve.value||55};state.leagues.push(l);state.activeLeagueId=l.id;save();closeM("leagueModal");renderAll()}
function renderHome(){const l=L();subtitle.textContent=l?l.name+" · "+l.teams.find(t=>t.isMine).name:"Nessuna lega selezionata";leagueList.innerHTML=state.leagues.length?state.leagues.map(x=>{const me=x.teams.find(t=>t.isMine);return`<div class="league ${x.id===state.activeLeagueId?"active":""}"><div><b>${esc(x.name)}</b><div class="meta">${esc(me.name)} · ${money(me.budgetLeft)} crediti</div></div><div class="actions"><button class="btn soft" data-openleague="${x.id}">Apri</button><button class="btn danger" data-delete="${x.id}">Elimina</button></div></div>`}).join(""):'<div class="empty">Nessuna lega.</div>';if(!l){budgetPanel.innerHTML=dashboard.innerHTML='<div class="empty">Seleziona una lega.</div>';return}const me=l.teams.find(t=>t.isMine),r=reserves(l,me),total=Object.values(l.slots).reduce((a,b)=>a+b,0);budgetPanel.innerHTML=`<div class="reserve-grid"><div class="reserve"><small>Residui</small><b>${money(me.budgetLeft)}</b></div><div class="reserve"><small>Libero reale</small><b>${money(r.free)}</b></div><div class="reserve"><small>Riserva attacco</small><b>${money(r.attackReserve)}</b></div><div class="reserve"><small>Riserva C offensivi</small><b>${money(r.midReserve)}</b></div></div><div class="meta" style="margin-top:8px">Completamento minimo: ${money(r.completion)}</div>`;dashboard.innerHTML=`<h2>${esc(l.name)}</h2><div class="stats"><div class="stat"><span>Budget</span><b>${money(me.budgetLeft)}</b></div><div class="stat"><span>Speso</span><b>${money(me.budgetStart-me.budgetLeft)}</b></div><div class="stat"><span>Giocatori</span><b>${me.roster.length}</b></div><div class="stat"><span>Mancano</span><b>${Math.max(0,total-me.roster.length)}</b></div></div>`}
function renderCall(){callRoleChips.innerHTML=["P","D","C","A"].map(r=>`<button class="chip ${r===callRole?"active":""}" data-callrole="${r}">${r}</button>`).join("");const l=L();if(!l){callAi.innerHTML='<b>AI strategica</b><div class="meta">Seleziona una lega.</div>';callList.innerHTML='<div class="empty">Nessuna lega.</div>';return}const me=l.teams.find(t=>t.isMine),r=reserves(l,me),arr=shortlist(callRole);callCount.textContent=arr.length;callAi.innerHTML=`<div class="ai-head"><b>AI strategica</b><span class="meta">budget protetto</span></div><div>Libero reale <b>${money(r.free)}</b> · Attacco <b>${money(r.attackReserve)}</b> · C offensivi <b>${money(r.midReserve)}</b></div>`;callList.innerHTML=(arr.length<10?`<div class="notice">Sono presenti ${arr.length} candidati. La lista richiede almeno 10 nomi reali: importa il database dell'altra chat.</div>`:"")+arr.map(p=>{const s=status(p.id),b=bandOf(p);return`<div class="call-card ${b} ${s}"><div><span class="band band-${b}">${b==="high"?"FASCIA ALTA":b==="mid"?"FASCIA MEDIA":"FASCIA BASSA"}</span><div class="call-name" style="margin-top:5px">${esc(p.name)}</div><div class="meta">${esc(p.team)} · ${tierLabel(p.tier)} · Bonus ${+p.bonus||0} · Mod ${+p.modifier||0} · MAX ${maxBid(p,l,me)}</div><div class="meta">${s==="taken"?"✓ PRESO":s==="lost"?"✕ PERSO":"DA CHIAMARE"}</div></div><div class="quick-actions"><button class="thumb up" data-up="${p.id}">👍</button><button class="thumb down" data-down="${p.id}">👎</button></div></div>`}).join("")}
function advice(p,l,me,max){const r=reserves(l,me);let a=(+p.bonus>=7?"Profilo bonus prioritario. ":+p.bonus>=4?"Buon potenziale bonus. ":"Prezzo disciplinato. ");if(+p.modifier>=7)a+="Utile al modificatore. ";if(p.role!=="A"&&r.attackReserve>0)a+="Proteggi la riserva top attacco. ";return a+`Rilancio fino a ${max}.`}
function renderAuction(){const l=L();if(!l){auctionHost.innerHTML='<div class="card empty">Seleziona una lega.</div>';return}const me=l.teams.find(t=>t.isMine),q=(document.getElementById("auctionSearch")?.value||"").toLowerCase(),ps=state.players.filter(p=>p.role===activeRole&&(!q||p.name.toLowerCase().includes(q)||p.team.toLowerCase().includes(q)));let p=state.players.find(x=>x.id===selectedPlayerId&&x.role===activeRole)||ps[0]||null;if(p)selectedPlayerId=p.id;const r=reserves(l,me),max=p?maxBid(p,l,me):0;auctionHost.innerHTML=`<div class="auction-layout"><div class="card"><h2>Asta Live</h2><div class="chips">${["P","D","C","A"].map(x=>`<button class="chip ${x===activeRole?"active":""}" data-role="${x}">${x}</button>`).join("")}</div><div style="height:12px"></div><div class="muted">Fantagettoni residui</div><div class="big">${money(me.budgetLeft)}</div><div class="reserve-grid"><div class="reserve"><small>Libero reale</small><b>${money(r.free)}</b></div><div class="reserve"><small>Attacco</small><b>${money(r.attackReserve)}</b></div><div class="reserve"><small>C offensivi</small><b>${money(r.midReserve)}</b></div><div class="reserve"><small>Slot ${activeRole}</small><b>${Math.max(0,l.slots[activeRole]-roleCount(me,activeRole))}</b></div></div>${p?`<hr style="border:0;border-top:1px solid var(--line);margin:15px 0"><div class="meta">${esc(p.team)} · ${tierLabel(p.tier)}</div><h1>${esc(p.name)}</h1><div class="stats"><div class="stat"><span>Target</span><b>${Math.max(1,Math.floor(max*.75))}</b></div><div class="stat"><span>MAX</span><b>${max}</b></div></div><div class="ai-box"><div class="ai-head"><b>ChatGPT stratega</b><span class="meta">live</span></div><div id="aiText">${esc(advice(p,l,me,max))}</div><div style="height:9px"></div><button class="btn soft full" id="askAI">Chiedi a ChatGPT</button></div><div style="height:10px"></div><button class="btn primary full" id="buyBtn">Assegna / compra</button>`:'<div class="empty">Nessun giocatore.</div>'}</div><div class="card"><h2>Giocatori ${activeRole}</h2><input id="auctionSearch" class="search" value="${esc(q)}" placeholder="Cerca"><div class="player-list">${ps.map(x=>{const o=owner(x.id,l);return`<button class="player ${o?"sold":""} ${x.id===selectedPlayerId?"selected":""}" data-player="${x.id}"><div class="player-name">${esc(x.name)}</div><div class="meta">${esc(x.team)} · ${tierLabel(x.tier)} · bonus ${+x.bonus||0} · mod ${+x.modifier||0}</div>${o?`<div class="meta">✓ VENDUTO a ${esc(o.team.name)} · ${money(o.record.price)}</div>`:""}</button>`}).join("")||'<div class="empty">Database vuoto.</div>'}</div></div></div>`;const s=document.getElementById("auctionSearch");if(s)s.oninput=renderAuction}
async function askAI(){const l=L(),me=l?.teams.find(t=>t.isMine),p=state.players.find(x=>x.id===selectedPlayerId);if(!l||!me||!p)return;const box=document.getElementById("aiText");box.textContent="Analisi ChatGPT…";try{const res=await fetch("/api/strategy",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({league:l,myTeam:me,selectedPlayer:p,activeRole,reserves:reserves(l,me),shortlist:shortlist(activeRole).slice(0,12)})});if(!res.ok)throw 0;const d=await res.json();box.textContent=d.analysis||"Analisi ricevuta."}catch(e){box.textContent="Backend AI non ancora attivo. Strategia locale: "+advice(p,l,me,maxBid(p,l,me))}}
function openBuy(pid,mine=false){const l=L(),p=state.players.find(x=>x.id===(pid||selectedPlayerId));if(!l||!p)return;if(owner(p.id,l)){alert("Giocatore già assegnato.");return}selectedPlayerId=p.id;buyPlayerName.textContent=p.name+" · "+p.team;buyPrice.value=1;const teams=mine?l.teams.filter(t=>t.isMine):l.teams;buyOwner.innerHTML=teams.map(t=>`<option value="${t.id}">${esc(t.name)} · ${money(t.budgetLeft)}</option>`).join("");openM("buyModal")}function confirmBuy(){const l=L(),p=state.players.find(x=>x.id===selectedPlayerId),t=l?.teams.find(x=>x.id===buyOwner.value),price=Math.max(1,+buyPrice.value||1);if(!l||!p||!t)return;if(price>t.budgetLeft){alert("Budget insufficiente.");return}if(t.isMine&&roleCount(t,p.role)>=l.slots[p.role]){alert("Slot pieni.");return}t.budgetLeft-=price;t.roster.push({playerId:p.id,price});setStatus(p.id,t.isMine?"taken":"lost");save();closeM("buyModal");renderAll()}
function renderRoster(){const l=L();if(!l){rosterHost.innerHTML='<div class="card empty">Nessuna lega.</div>';return}rosterHost.innerHTML=`<div class="card"><h1>Rose</h1><div class="team-grid">${l.teams.map(t=>`<div class="team-card"><div class="team-head"><b>${esc(t.name)}${t.isMine?" · TU":""}</b><b>${money(t.budgetLeft)}</b></div><table><tbody>${t.roster.map(r=>{const p=state.players.find(x=>x.id===r.playerId);return p?`<tr><td><span class="role">${p.role}</span></td><td><b>${esc(p.name)}</b><div class="meta">${esc(p.team)}</div></td><td>${money(r.price)}</td></tr>`:""}).join("")||'<tr><td class="muted">Nessun acquisto</td></tr>'}</tbody></table></div>`).join("")}</div></div>`}
function renderPlayers(){const q=(document.getElementById("playerSearch")?.value||"").toLowerCase(),arr=state.players.filter(p=>!q||p.name.toLowerCase().includes(q)||p.team.toLowerCase().includes(q));playersTable.innerHTML=arr.length?`<table><thead><tr><th>R</th><th>Giocatore</th><th>Fascia</th><th>Bonus</th><th>Mod</th><th>Priorità</th></tr></thead><tbody>${arr.map(p=>`<tr><td><span class="role">${p.role}</span></td><td><b>${esc(p.name)}</b><div class="meta">${esc(p.team)}</div></td><td>${tierLabel(p.tier)}</td><td>${+p.bonus||0}</td><td>${+p.modifier||0}</td><td>${+p.priority||0}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">Database vuoto.</div>';const s=document.getElementById("playerSearch");if(s)s.oninput=renderPlayers}
function splitCSV(line){const o=[];let c="",q=false;for(let i=0;i<line.length;i++){const x=line[i];if(x==='\"'){if(q&&line[i+1]==='\"'){c+='\"';i++}else q=!q}else if((x===","||x===";")&&!q){o.push(c.trim());c=""}else c+=x}o.push(c.trim());return o}function parseCSV(text){const lines=text.replace(/\r/g,"").split("\n").filter(Boolean);if(lines.length<2)return[];const h=splitCSV(lines[0]).map(x=>x.toLowerCase());return lines.slice(1).map(row=>{const v=splitCSV(row),o={};h.forEach((k,i)=>o[k]=v[i]||"");const role=(o.role||o.ruolo||"").toUpperCase(),name=o.name||o.nome;if(!name||!["P","D","C","A"].includes(role))return null;return{id:uid("p"),name,team:o.team||o.squadra||"",role,tier:(o.tier||o.fascia||"value").toLowerCase(),starter:o.starter||o.titolarita||"",tactical:o.tactical||o.ruoloreale||o.ruolo_reale||"",quote:+o.quote||+o.quotazione||0,bonus:+o.bonus||0,modifier:+o.modifier||o.modificatore||0,priority:+o.priority||o.priorita||0,call:o.call||o.chiama||""}}).filter(Boolean)}function importCSV(f){const r=new FileReader;r.onload=()=>{const a=parseCSV(r.result);if(!a.length){alert("CSV non riconosciuto.");return}state.players=a;save();renderAll();alert("Importati "+a.length+" giocatori.")};r.readAsText(f)}function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function exportCSV(){const rows=[["name","team","role","tier","starter","tactical","quote","bonus","modifier","priority","call"],...state.players.map(p=>[p.name,p.team,p.role,p.tier,p.starter,p.tactical,p.quote,p.bonus,p.modifier,p.priority,p.call])];download("fantasquadra-giocatori.csv",rows.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\n"),"text/csv")}
function switchView(v){document.querySelectorAll(".view").forEach(x=>x.classList.add("hidden"));document.getElementById("view-"+v).classList.remove("hidden");document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.view===v));if(v==="call")renderCall();if(v==="auction")renderAuction();if(v==="roster")renderRoster();if(v==="players")renderPlayers()}function renderAll(){renderHome();renderCall();renderAuction();renderRoster();renderPlayers()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.view)switchView(b.dataset.view);if(b.dataset.close)closeM(b.dataset.close);if(b.dataset.openleague){state.activeLeagueId=b.dataset.openleague;save();renderAll()}if(b.dataset.delete&&confirm("Eliminare la lega?")){state.leagues=state.leagues.filter(x=>x.id!==b.dataset.delete);if(state.activeLeagueId===b.dataset.delete)state.activeLeagueId=state.leagues[0]?.id||null;save();renderAll()}if(b.dataset.callrole){callRole=b.dataset.callrole;renderCall()}if(b.dataset.role){activeRole=b.dataset.role;selectedPlayerId=null;renderAuction()}if(b.dataset.player){selectedPlayerId=b.dataset.player;renderAuction()}if(b.dataset.up)openBuy(b.dataset.up,true);if(b.dataset.down){setStatus(b.dataset.down,"lost");renderCall()}if(b.id==="buyBtn")openBuy();if(b.id==="askAI")askAI()});newLeagueTop.onclick=newLeague;newLeagueHome.onclick=newLeague;saveLeague.onclick=saveLeague;confirmBuy.onclick=confirmBuy;csvInput.onchange=e=>e.target.files[0]&&importCSV(e.target.files[0]);exportCsv.onclick=exportCSV;renderAll();})();
</script></body></html>
